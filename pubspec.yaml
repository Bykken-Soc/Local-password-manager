name: final_project_desktop
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ^0.5.24
  provider: ^6.1.5+1
  go_router: ^17.2.3
  dio: ^5.9.2
  get_it: ^9.2.1
